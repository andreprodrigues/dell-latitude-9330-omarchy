# Dell Broadcom ControlVault 3 (0a5c:5843): answer the chip's host-timestamp
# interrupt the proprietary TOD driver ignores (enroll/verify hang otherwise).
# Source: https://github.com/GrecAndrei/controlvault-fingerprint-passkey-toolkit (broadcom-host-event-shim)
[Service]
ExecStart=
ExecStart=/usr/lib/fprintd --no-timeout
Environment=LD_PRELOAD=/usr/local/lib/libbcm-cv-host-event-shim.so
